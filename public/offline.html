<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0c0e">
<title>Signal lost — Srrlovych</title>
<style>
  :root {
    --bg: #0c0c0e;
    --panel: #141417;
    --line: rgba(243, 241, 236, .14);
    --ink: #f3f1ec;
    --dim: #8e8d93;
    --red: #d9291f;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(24px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    max-width: 520px;
    margin: 0 auto;
    font: 14px/1.5 var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  .tape { height: 8px; background: repeating-linear-gradient(135deg, var(--red) 0 12px, var(--ink) 12px 24px); }
  .rec { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 12px; color: var(--dim); }
  .dot { width: 8px; height: 8px; background: var(--red); animation: rec 1.2s steps(1) infinite; }
  @keyframes rec { 50% { opacity: .15; } }
  .frame {
    position: relative;
    margin: auto 0 20px;
    padding: 40px 16px;
    border: 2px solid var(--ink);
    background: var(--panel);
    text-align: center;
  }
  .tag { position: absolute; top: 8px; left: 8px; padding: 2px 6px; background: var(--red); color: #fff; font-size: 10px; }
  h1 { margin: 0; font-size: clamp(34px, 11vw, 52px); line-height: 1; font-weight: 700; letter-spacing: -.02em; }
  p { margin: 0 0 24px; color: var(--dim); }
  button {
    appearance: none;
    min-height: 48px;
    padding: 12px 16px;
    border: 1px solid var(--ink);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    transition: color .15s, background-color .15s, transform .15s;
  }
  button:hover { background: var(--red); border-color: var(--red); color: #fff; }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
  .coords { margin-top: 16px; text-align: center; font-size: 11px; color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
  <div class="tape" aria-hidden="true"></div>
  <div class="rec"><span class="dot" aria-hidden="true"></span>no signal</div>
  <div class="frame">
    <span class="tag" aria-hidden="true">cam-00</span>
    <h1>немає<br>зв’язку</h1>
  </div>
  <p>суб’єкт поза зоною спостереження. перевір інтернет — сторінка оновиться сама.</p>
  <button type="button" onclick="location.reload()">спробувати ще</button>
  <div class="coords">ужгород · 48.62n 22.29e</div>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
